services:
  mongo:
    image: mongodb/mongodb-atlas-local:8.0
    container_name: wave-mongo
    hostname: mongo
    volumes:
      - wave_mongo_data:/data/db
      - wave_mongo_config:/data/configdb
      - wave_mongot_data:/data/mongot
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand("ping").ok']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: wave-server
    env_file:
      - ./.env
    environment:
      - MONGO_URI=mongodb://mongo:27017/wave?directConnection=true
      - CLIENT_ORIGIN=http://localhost:${WAVE_PORT:-3742}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: wave-client
    ports:
      - '${WAVE_PORT:-3742}:80'
    depends_on:
      - server
    restart: unless-stopped

volumes:
  wave_mongo_data:
  wave_mongo_config:
  wave_mongot_data:
